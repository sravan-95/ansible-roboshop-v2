- name: enable node js 20
  command: dnf module enable nodejs:20 -y
- name: install nodejs 20
  ansible.builtin.package:
   name: nodejs
   state: present
- name: create system user
  ansible.builtin.user:
   name: roboshop
   system: true
   home: /app
   shell: /sbin/nologin
   comment: "Roboshop System user"
- name: remove old app directory
  ansible.builtin.file:
   path: /app
   state: absent
- name: delete catalogue.zip in tmp directory
  ansible.builtin.file:
   path: /tmp/catalogue.zip
   state: absent
- name: create app directory
  ansible.builtin.file:
   path: /app
   tate: directory
- name: download catalogue
  ansible.builtin.get_url:
   url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
   dest: /tmp/catalogue.zip
- name: unzip catalogue
  ansible.builtin.unarchive:
   src: /tmp/catalogue.zip
   dest: /app
   remote_src: yes
- name: install dependencies
  community.general.npm:
   path: /app
- name: copy catalogue service
  ansible.builtin.template:
   src: catalogue.service
   dest: /etc/systemd/system/catalogue.service
- name: copy mongodb repo
  ansible.builtin.copy:
   src: mongo.repo
   dest: /etc/yum.repos.d/mongo.repo
- name: install mongodb client
  ansible.builtin.package:
   name: mongodb-mongosh
   state: present
- name: check catalogue schema exist ot not
  shell: mongosh --host "{{ MONGODB_HOST }}" --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
  register: catalogue_output
  tags:
  - sai
- name: print catalogue_output
  debug: 
   msg: "{{ catalogue_output }}"
  tags:
  - mongodb
- name: load products
  shell: mongosh --host "{{ MONGODB_HOST }}" </app/db/master-data.js
  when: catalogue_output.stdout | int < 0
  tags:
  - mongodb
- name: deamon reload
  systemd_service:
    name: catalogue
    daemon_reload: true
- name: enable and start catalogue
  service:
    name: catalogue
    state: restarted
    enabled: yes